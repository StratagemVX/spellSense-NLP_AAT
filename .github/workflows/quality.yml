name: Quality & Security Checks

on:
  push:
    branches: ["main", "maintenance/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Download TextBlob / NLTK corpora
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('brown')"

      - name: Run backend security and API tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies cleanly
        run: npm ci --ignore-scripts

      - name: Audit production dependencies (critical threshold)
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
